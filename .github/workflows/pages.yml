name: Trama — validar e publicar

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trama-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Auditoria, check e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Compilar o gerador e conferir JavaScript
        run: |
          python -m py_compile tools/build.py tools/views.py tools/highlight.py tools/qa_static.py
          node --check assets/site.js
          node --check assets/analytics.js
      - name: Gerar site
        run: python tools/build.py
      - name: Validar links, IDs, sintaxe e exemplos
        run: |
          python tools/qa_static.py
          python tools/qa_regressions.py
          python tools/qa_analytics_static.py
          node tools/qa_examples.mjs
          python tools/audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: validacao-trama
          path: reports/

  build-pages:
    name: Preparar GitHub Pages
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    name: Publicar GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build-pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
