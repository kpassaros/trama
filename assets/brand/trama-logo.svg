  <circle cx="33" cy="81" r="7" fill="#7563AD"/>
  <circle cx="87" cy="81" r="7" fill="#7563AD"/>
  <circle cx="60" cy="60" r="11" fill="#20505A" stroke="#fffefe" stroke-width="4"/>
</g>
<text x="152" y="73" fill="#20505A" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="70" font-weight="750" letter-spacing="-3.5">trama</text>
